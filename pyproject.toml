[project]
name = "genai-assignment"
version = "0.1.0"
description = "AI-4009 Generative AI Assignment #1 — Autoencoders, MoE, Conditional GAN"
requires-python = ">=3.11,<3.13"
dependencies = [
    # --- Core ML ---
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "pytorch-msssim>=1.0.0",
    # --- HPO ---
    "optuna>=3.4.0",
    "optuna-integration>=3.6.0",
    # --- Experiment Tracking ---
    "mlflow>=2.10.0",
    # --- ONNX Export & Inference ---
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
    # --- Backend ---
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.2.0",
    # --- Utilities ---
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
    "onnxscript>=0.7.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

