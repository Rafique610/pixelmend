# ==============================================================================
# PixelMend Nginx Reverse Proxy & Static SPA Configuration
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Maximum allowed request size for high-resolution image uploads
    client_max_body_size 25M;

    # Static web build root directory
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for high-performance static asset delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Health Monitoring Reverse Proxy
    # --------------------------------------------------------------------------
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --------------------------------------------------------------------------
    # REST API Reverse Proxy (Tasks 1-4 Endpoints)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
    }

    # --------------------------------------------------------------------------
    # FastAPI Interactive OpenAPI Documentation (Evaluator Convenience)
    # --------------------------------------------------------------------------
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # --------------------------------------------------------------------------
    # Static Assets Caching
    # --------------------------------------------------------------------------
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # SPA Client-Side HTML5 Fallback Routing
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
